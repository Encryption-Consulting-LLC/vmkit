[project]
name = "vmkit"
version = "0.4.0"
description = "ESXi/vCenter VM automation library: connect, clone, datastore ops, VMX rendering."
requires-python = ">=3.14"
dependencies = [
    "pyvmomi>=9.1.0.0",
    "requests>=2.34.2",
    # Imported directly (datastore transfers suppress its InsecureRequestWarning);
    # previously present only transitively via requests.
    "urllib3>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vmkit"]
